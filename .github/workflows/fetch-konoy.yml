name: fetch-konoy

on:
  push:
    branches: [arena/48c0a92d-repo]
    paths: ['.github/workflows/fetch-konoy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Download konoy.zip from Google Drive (public link)
        run: |
          set -euxo pipefail
          pip install -q gdown
          gdown 1K5Egd3z1XONlfiJAjPnoqrH-Gg2YPD_d -O konoy.zip
          test "$(stat -c%s konoy.zip)" = "159324312"
          sha256sum konoy.zip | tee checksum.txt

      - name: List zip contents into LISTING.txt
        run: |
          set -euxo pipefail
          python3 - <<'EOF' | tee LISTING.txt
          import zipfile
          with zipfile.ZipFile('konoy.zip') as z:
              print('CRC:', 'OK' if z.testzip() is None else 'BAD')
              for i in z.infolist():
                  print(f"{i.file_size:>12}  {i.filename}")
          EOF

      - name: Publish progress marker to session branch (via API)
        run: |
          set -euxo pipefail
          CONTENT=$(printf 'downloaded+listed\n%s\n' "$(cat LISTING.txt)" | base64 -w0)
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/.ci/konoy-progress.txt" \
            -f message="ci: konoy progress (listing)" \
            -f branch="arena/48c0a92d-repo" \
            -f content="$CONTENT" --jq '.commit.sha'

      - name: Split into <100MB chunks and push tag konoy-data
        run: |
          set -euxo pipefail
          trap 'echo "::error::split/push FAILED at script line ${LINENO} (exit ${?})"' ERR
          git init datarepo
          cd datarepo
          git config user.email "ci@localhost"
          git config user.name "konoy-ci"
          git checkout --orphan konoy-data
          cp ../LISTING.txt ../checksum.txt .
          split -b 95M ../konoy.zip chunk-
          ls -l chunk-*
          for f in chunk-*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -ge 104857600 ]; then echo "::error::${f} too big (${sz})"; exit 1; fi
          done
          git add chunk-* LISTING.txt checksum.txt
          git commit -m "konoy.zip relay chunks (from Google Drive via Actions)"
          git tag -f konoy-data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin refs/tags/konoy-data
          echo "::notice::konoy-data tag pushed OK"
