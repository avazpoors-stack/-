name: fetch-konoy

on:
  push:
    branches: [arena/48c0a92d-repo]
    paths: ['.github/workflows/fetch-konoy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download konoy.zip from Google Drive (public link)
        run: |
          set -euo pipefail
          pip install -q gdown
          gdown 1K5Egd3z1XONlfiJAjPnoqrH-Gg2YPD_d -O konoy.zip
          echo "size=$(stat -c%s konoy.zip)"
          stat -c%s konoy.zip | grep -qx 159324312 && echo "SIZE_OK" || { echo "SIZE_MISMATCH"; exit 1; }
          sha256sum konoy.zip

      - name: Show zip contents (for the log)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('konoy.zip') as z:
              bad = z.testzip()
              print('CRC:', 'OK' if bad is None else f'BAD -> {bad}')
              for i in z.infolist():
                  print(f"{i.file_size:>12}  {i.filename}")
          EOF

      - name: Split into <100MB chunks and publish as tag konoy-data
        run: |
          set -euo pipefail
          git init datarepo
          cd datarepo
          git config user.email "ci@localhost"
          git config user.name "konoy-ci"
          git checkout --orphan konoy-data
          split -b 95M ../konoy.zip chunk-
          ls -l chunk-*
          for f in chunk-*; do
            sz=$(stat -c%s "$f")
            [ "$sz" -lt 104857600 ] || { echo "$f too big"; exit 1; }
          done
          git add chunk-*
          git commit -m "konoy.zip split chunks (relay from Google Drive)"
          git tag -f konoy-data
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin refs/tags/konoy-data
